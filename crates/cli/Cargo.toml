[package]
name = "cli"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["bracketed-paste", "event-stream"] }
dotenvy = "0.15"
api = { path = "../api" }
harness = { path = "../harness" }
futures-util = "0.3"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
release-info = { path = "../release-info" }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
vfs = { path = "../vfs" }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "lightspeed"
path = "src/main.rs"

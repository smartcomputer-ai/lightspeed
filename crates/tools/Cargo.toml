[package]
name = "tools"
version = "0.1.0"
edition = "2024"

[dependencies]
api = { path = "../api" }
async-trait = "0.1"
harness = { path = "../harness" }
futures-util = "0.3"
glob = "0.3"
environment-client = { path = "../environment-client" }
environment-protocol = { path = "../environment-protocol" }
jsonschema = { version = "0.58", default-features = false }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["fs", "net", "rt", "sync"] }
uuid = { version = "1", features = ["v4"] }
vfs = { path = "../vfs" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt"] }

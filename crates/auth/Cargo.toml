[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
api = { path = "../api" }
async-trait = "0.1"
base64 = "0.22"
engine = { path = "../engine" }
futures-util = "0.3"
hex = "0.4"
jsonwebtoken = "9"
oauth2 = { version = "5", default-features = false }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls", "stream"] }
rmcp = { version = "3.1.4", default-features = false, features = ["auth", "client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["net", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
uuid = "1"

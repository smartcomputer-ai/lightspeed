[package]
name = "environment-provider-incus"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
environment-protocol = { path = "../environment-protocol" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
release-info = { path = "../release-info" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[dev-dependencies]
# The controller conformance suite runs against this server in unit tests
# (with an in-memory backend) and against live Incus.
environment-client = { path = "../environment-client", features = ["conformance"] }
tempfile = "3"
# The data conformance suite runs against a guest envd on live Incus.
tools = { path = "../tools" }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "lightspeed-provider-incus"
path = "src/main.rs"

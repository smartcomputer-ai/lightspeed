[package]
name = "temporal-workflow"
version = "0.1.0"
edition = "2024"

[dependencies]
api = { path = "../api" }
bots = { path = "../bots" }
channels = { path = "../channels" }
harness = { path = "../harness", features = ["contract"] }
schemars = { version = "1", features = ["uuid1"] }
sha2 = "0.11"
hex = "0.4"
environment-protocol = { path = "../environment-protocol" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
temporalio-client = "1"
temporalio-common = "1"
temporalio-macros = "1"
temporalio-sdk = "1"
temporalio-workflow = "1"
url = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }

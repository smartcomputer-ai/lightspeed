[package]
name = "temporal-runtime"
version.workspace = true
edition = "2024"

[dependencies]
temporal-workflow = { path = "../temporal-workflow" }
jsonschema = { version = "0.58", default-features = false }
ipnet = "2"
api = { path = "../api" }
api-projection = { path = "../api-projection" }
harness = { path = "../harness" }
environments = { path = "../environments" }
environment-client = { path = "../environment-client" }
environment-protocol = { path = "../environment-protocol" }
vfs = { path = "../vfs" }
anyhow = "1"
async-trait = "0.1"
auth = { path = "../auth" }
bots = { path = "../bots" }
channels = { path = "../channels" }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ed25519-dalek = "3"
rand = "0.10"
sha2 = "0.11"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
futures = "0.3"
http = "1"
llm-clients = { path = "../llm-clients" }
llm-runtime = { path = "../llm-runtime" }
mcp = { path = "../mcp" }
object_store = "0.14"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
profiles = { path = "../profiles" }
release-info = { path = "../release-info" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.1.4", default-features = false, features = ["client", "transport-streamable-http-client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rmcp exposes sse-stream 0.2 types in its transport trait.
sse-stream = "0.2.5"
store-pg = { path = "../store-pg" }
temporalio-common = "1"
temporalio-client = "1"
temporalio-macros = "1"
temporalio-sdk = "1"
temporalio-workflow = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tonic = "0.14"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tools = { path = "../tools" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
test-support = { path = "../test-support" }
dotenvy = "0.15"
environment-daemon = { path = "../environment-daemon" }
futures-util = "0.3"
tempfile = "3"

[[bin]]
name = "lightspeed-runtime"
path = "src/main.rs"

[package]
name = "llm-clients"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
futures-util = "0.3"
httpdate = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
base64 = "0.23"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }

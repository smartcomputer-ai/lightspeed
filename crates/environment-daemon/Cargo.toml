[package]
name = "environment-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
api = { path = "../api" }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
glob = "0.3"
grep-regex = "0.1"
grep-searcher = "0.1"
host-protocol = { path = "../host-protocol" }
ignore = "0.4"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
engine = { path = "../engine" }
host-client = { path = "../host-client" }
tempfile = "3"
tools = { path = "../tools" }

[[bin]]
name = "lightspeed-envd"
path = "src/main.rs"

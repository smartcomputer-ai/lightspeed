[package]
name = "environment-daemon"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
api = { path = "../api" }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
release-info = { path = "../release-info" }
futures-util = "0.3"
flate2 = "1"
glob = "0.3"
grep-regex = "0.1"
grep-searcher = "0.1"
environment-protocol = { path = "../environment-protocol" }
ignore = "0.4"
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
async-trait = "0.1"
store-fs = { path = "../store-fs" }
vfs = { path = "../vfs" }
engine = { path = "../engine" }
environment-client = { path = "../environment-client" }
tools = { path = "../tools" }

[[bin]]
name = "lightspeed-envd"
path = "src/main.rs"

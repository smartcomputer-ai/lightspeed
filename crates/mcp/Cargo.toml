[package]
name = "mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
auth = { path = "../auth" }
harness = { path = "../harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11.1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[package]
name = "llm-simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
llm-clients = { path = "../llm-clients" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

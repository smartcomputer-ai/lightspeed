[package]
name = "channels"
version = "0.1.0"
edition = "2024"

[dependencies]
api = { path = "../api" }
async-trait = "0.1"
bots = { path = "../bots" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
hex = "0.4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

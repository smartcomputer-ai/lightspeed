[package]
name = "harness"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
schemars = { version = "1", optional = true, features = ["uuid1"] }

[features]
# JSON Schema derives for the types exported in the workflow contract
# (`temporal-workflow`). A derive only; nothing about harness behaviour changes.
contract = ["dep:schemars"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

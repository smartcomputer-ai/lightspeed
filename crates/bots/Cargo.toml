[package]
name = "bots"
version = "0.1.0"
edition = "2024"

[dependencies]
api = { path = "../api" }
async-trait = "0.1"
cel = "0.14"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
cron = "0.17"
hex = "0.4"
hmac = "0.13"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

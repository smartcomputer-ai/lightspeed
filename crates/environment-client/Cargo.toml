[package]
name = "environment-client"
version = "0.1.0"
edition = "2024"

[features]
# `conformance::controller`: a suite that drives any controller endpoint
# through `ControllerClient` and checks the controller-plane contract;
# `conformance::data_route`: checks of a data route's typed refusals.
conformance = []

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
environment-protocol = { path = "../environment-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[dev-dependencies]
environment-client = { path = ".", features = ["conformance"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "time"] }

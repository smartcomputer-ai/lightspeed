[package]
name = "environments"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
auth = { path = "../auth" }
harness = { path = "../harness" }
environment-protocol = { path = "../environment-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

name: ci

on:
  pull_request: {}
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      consumers: ${{ steps.classify.outputs.consumers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if test "$EVENT_NAME" = workflow_dispatch; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "consumers=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$BASE_SHA" =~ ^0{40}$ ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "consumers=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"

          rust=false
          consumers=false
          while IFS= read -r -d '' path; do
            case "$path" in
              crates/api/*)
                rust=true
                consumers=true
                ;;
              crates/*|Cargo.toml|Cargo.lock|rust-toolchain.toml)
                rust=true
                ;;
              clients/*|platform/*|package.json|package-lock.json|tsconfig.json)
                consumers=true
                ;;
              .github/workflows/*|release/*|scripts/*)
                rust=true
                consumers=true
                ;;
              docs/*|README.md|AGENTS.md|CLAUDE.md|LICENSE*|*.md)
                ;;
              *)
                # Unknown paths are checked conservatively so a new source or
                # build input cannot accidentally bypass CI.
                rust=true
                consumers=true
                ;;
            esac
          done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")

          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "consumers=$consumers" >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
        env:
          POSTGRES_USER: lightspeed
          POSTGRES_PASSWORD: lightspeed
          POSTGRES_DB: lightspeed
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U lightspeed"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Protocol Buffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libprotobuf-dev protobuf-compiler
          test -f /usr/include/google/protobuf/duration.proto
          echo "PROTOC_INCLUDE=/usr/include" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Exercise embedded migration ledger
        env:
          LIGHTSPEED_TEST_POSTGRES_URL: postgres://lightspeed:lightspeed@127.0.0.1:55432/lightspeed
        run: >-
          cargo test --locked -p store-pg --test migrations_live
          embedded_migrations_are_locked_idempotent_and_checksum_guarded
          -- --ignored --test-threads=1
      - run: scripts/release/verify-metadata.sh

  consumers:
    needs: changes
    if: needs.changes.outputs.consumers == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
        env:
          POSTGRES_USER: lightspeed
          POSTGRES_PASSWORD: lightspeed
          POSTGRES_DB: lightspeed
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U lightspeed"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check every Node consumer and integration boundary
        env:
          LIGHTSPEED_PLATFORM_MIGRATION_TEST_URL: postgres://lightspeed:lightspeed@127.0.0.1:55432/lightspeed
        run: npm run check:ci

  required:
    if: always()
    needs: [changes, rust, consumers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_NEEDED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          CONSUMERS_NEEDED: ${{ needs.changes.outputs.consumers }}
          CONSUMERS_RESULT: ${{ needs.consumers.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          if test "$RUST_NEEDED" = true; then
            test "$RUST_RESULT" = success
          fi
          if test "$CONSUMERS_NEEDED" = true; then
            test "$CONSUMERS_RESULT" = success
          fi

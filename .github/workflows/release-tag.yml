name: release tag

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, x64, hz01, protected]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      bundle_digest: ${{ steps.release_bundle.outputs.digest }}
      git_sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    services:
      postgres:
        image: postgres:17-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
        env:
          POSTGRES_USER: lightspeed
          POSTGRES_PASSWORD: lightspeed
          POSTGRES_DB: lightspeed
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U lightspeed"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Validate the annotated SemVer tag
        id: identity
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # OCI tags cannot contain SemVer build metadata's `+`, so release
          # versions support ordinary SemVer and prereleases, but no `+build`.
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git cat-file -t "$tag")" = tag
          sha="$(git rev-parse HEAD^{commit})"
          test "$(git rev-list -n 1 "$tag")" = "$sha"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$sha" origin/main
          source release/metadata.env
          test "$tag" = "v$LIGHTSPEED_PRODUCT_VERSION"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$LIGHTSPEED_PRODUCT_VERSION" >> "$GITHUB_OUTPUT"
          echo "staging_tag=staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test the exact tagged source
        env:
          LIGHTSPEED_TEST_POSTGRES_URL: postgres://lightspeed:lightspeed@127.0.0.1:55432/lightspeed
          LIGHTSPEED_PLATFORM_MIGRATION_TEST_URL: postgres://lightspeed:lightspeed@127.0.0.1:55432/lightspeed
        run: |
          set -euo pipefail
          cargo test --workspace --locked
          cargo test --locked -p store-pg --test migrations_live \
            embedded_migrations_are_locked_idempotent_and_checksum_guarded \
            -- --ignored --test-threads=1
          npm ci
          npm run check:ci
          scripts/release/verify-metadata.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Publish the exact release build environment to staging
        id: build_environment
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: release/build-env.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/build-env:${{ steps.identity.outputs.staging_tag }}
          provenance: mode=max
          sbom: true
      - name: Build the coherent artifact set once
        env:
          LIGHTSPEED_GIT_SHA: ${{ steps.identity.outputs.sha }}
          BUILD_IMAGE: ghcr.io/${{ github.repository }}/build-env@${{ steps.build_environment.outputs.digest }}
        run: LIGHTSPEED_RELEASE_BUILD_IMAGE="$BUILD_IMAGE" scripts/release/run-build-env.sh "$BUILD_IMAGE"
      - name: Build and publish the runtime image to staging
        id: runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: release/runtime.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            LIGHTSPEED_RELEASE_VERSION=${{ steps.identity.outputs.version }}
            LIGHTSPEED_GIT_SHA=${{ steps.identity.outputs.sha }}
          tags: ghcr.io/${{ github.repository }}/runtime:${{ steps.identity.outputs.staging_tag }}
          provenance: mode=max
          sbom: true
      - name: Build and publish Configurator MCP image to staging
        id: configurator
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: release/configurator-mcp.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            LIGHTSPEED_RELEASE_VERSION=${{ steps.identity.outputs.version }}
            LIGHTSPEED_GIT_SHA=${{ steps.identity.outputs.sha }}
          tags: ghcr.io/${{ github.repository }}/configurator-mcp:${{ steps.identity.outputs.staging_tag }}
          provenance: mode=max
          sbom: true
      - name: Build and publish platform image to staging
        id: platform
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: release/platform.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            LIGHTSPEED_RELEASE_VERSION=${{ steps.identity.outputs.version }}
            LIGHTSPEED_GIT_SHA=${{ steps.identity.outputs.sha }}
          tags: ghcr.io/${{ github.repository }}/platform:${{ steps.identity.outputs.staging_tag }}
          provenance: mode=max
          sbom: true
      - name: Build and publish Channels image to staging
        id: channels
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: release/channels.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            LIGHTSPEED_RELEASE_VERSION=${{ steps.identity.outputs.version }}
            LIGHTSPEED_GIT_SHA=${{ steps.identity.outputs.sha }}
          tags: ghcr.io/${{ github.repository }}/channels:${{ steps.identity.outputs.staging_tag }}
          provenance: mode=max
          sbom: true
      - name: Publish standalone archives to staging
        id: archives
        env:
          GHCR_ROOT: ghcr.io/${{ github.repository }}
          STAGING_TAG: ${{ steps.identity.outputs.staging_tag }}
        run: |
          set -euo pipefail
          declare -A files=(
            [server]="$(find dist/archives -name '*-server-*' -print -quit)"
            [provider-incus]="$(find dist/archives -name '*-provider-incus-*' -print -quit)"
            [envd]="$(find dist/archives -name '*-envd-*' -print -quit)"
            [cli]="$(find dist/archives -name '*-cli-*' -print -quit)"
          )
          for name in server provider-incus envd cli; do
            test -n "${files[$name]}"
            ref="$GHCR_ROOT/${name}-bundle:$STAGING_TAG"
            oras push "$ref" "${files[$name]}:application/gzip"
            digest="$(oras resolve "$ref")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            key="${name^^}"
            key="${key//-/_}"
            echo "${key}_URL=oci://$GHCR_ROOT/${name}-bundle@$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Finalize the digest-pinned manifest and staged bundle
        id: release_bundle
        env:
          LIGHTSPEED_RUNTIME_IMAGE: ghcr.io/${{ github.repository }}/runtime@${{ steps.runtime.outputs.digest }}
          LIGHTSPEED_CONFIGURATOR_MCP_IMAGE: ghcr.io/${{ github.repository }}/configurator-mcp@${{ steps.configurator.outputs.digest }}
          LIGHTSPEED_PLATFORM_IMAGE: ghcr.io/${{ github.repository }}/platform@${{ steps.platform.outputs.digest }}
          LIGHTSPEED_CHANNELS_IMAGE: ghcr.io/${{ github.repository }}/channels@${{ steps.channels.outputs.digest }}
          LIGHTSPEED_RELEASE_BUILD_IMAGE: ghcr.io/${{ github.repository }}/build-env@${{ steps.build_environment.outputs.digest }}
          LIGHTSPEED_BINARY_URL_SERVER: ${{ steps.archives.outputs.SERVER_URL }}
          LIGHTSPEED_BINARY_URL_PROVIDER_INCUS: ${{ steps.archives.outputs.PROVIDER_INCUS_URL }}
          LIGHTSPEED_BINARY_URL_ENVD: ${{ steps.archives.outputs.ENVD_URL }}
          LIGHTSPEED_BINARY_URL_CLI: ${{ steps.archives.outputs.CLI_URL }}
          STAGING_TAG: ${{ steps.identity.outputs.staging_tag }}
        run: |
          set -euo pipefail
          find dist/runtime -depth -delete
          scripts/release/create-manifest.mjs \
            "${{ steps.identity.outputs.version }}" "${{ steps.identity.outputs.sha }}"
          scripts/release/checksums.sh
          scripts/release/verify-manifest.mjs --published
          (cd dist && sha256sum --check checksums.txt)
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf release-bundle.tar.gz dist
          bundle_ref="ghcr.io/${{ github.repository }}/release-bundle:$STAGING_TAG"
          oras push "$bundle_ref" release-bundle.tar.gz:application/gzip
          bundle_digest="$(oras resolve "$bundle_ref")"
          [[ "$bundle_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$bundle_digest" >> "$GITHUB_OUTPUT"
      - name: Verify the staged runtime images
        env:
          RUNTIME_IMAGE: ghcr.io/${{ github.repository }}/runtime@${{ steps.runtime.outputs.digest }}
          CONFIGURATOR_IMAGE: ghcr.io/${{ github.repository }}/configurator-mcp@${{ steps.configurator.outputs.digest }}
          PLATFORM_IMAGE: ghcr.io/${{ github.repository }}/platform@${{ steps.platform.outputs.digest }}
          CHANNELS_IMAGE: ghcr.io/${{ github.repository }}/channels@${{ steps.channels.outputs.digest }}
          PLATFORM_DATABASE_URL: postgres://lightspeed:lightspeed@127.0.0.1:55432/lightspeed
          EXPECTED_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          docker pull "$RUNTIME_IMAGE"
          container_id="$(docker create "$RUNTIME_IMAGE" --version)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir image-check
          docker cp "$container_id:/usr/local/bin/lightspeed-server" image-check/lightspeed-server
          cmp dist/bin/lightspeed-server image-check/lightspeed-server
          docker run --rm "$RUNTIME_IMAGE" --version | grep -F "$EXPECTED_SHA"
          docker pull "$CONFIGURATOR_IMAGE"
          docker run --rm --entrypoint node "$CONFIGURATOR_IMAGE" -e \
            'const fs = require("node:fs"); for (const f of ["/app/dist/bin.js", "/app/agent-client.tgz"]) fs.accessSync(f);'
          scripts/release/smoke-images.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/archives/*.tar.gz
            dist/npm/*.tgz
            dist/checksums.txt
            dist/release-manifest.json
            dist/sbom.spdx.json
            release-bundle.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lightspeed-release-${{ steps.identity.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            release-bundle.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: build
    runs-on: [self-hosted, linux, x64, hz01, protected]
    environment: official-release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.tag }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org
      - name: Retrieve and verify this build's bundle by digest
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "${{ needs.build.outputs.git_sha }}"
          root="ghcr.io/${{ github.repository }}/release-bundle"
          oras pull "$root@${{ needs.build.outputs.bundle_digest }}"
          tar -xzf release-bundle.tar.gz
          scripts/release/verify-manifest.mjs --published
          test "$(jq -r .gitSha dist/release-manifest.json)" = "${{ needs.build.outputs.git_sha }}"
          test "$(jq -r .version dist/release-manifest.json)" = "${{ needs.build.outputs.version }}"
          (cd dist && sha256sum --check checksums.txt)
      - name: Publish SemVer aliases from exact manifest digests
        env:
          GHCR_ROOT: ghcr.io/${{ github.repository }}
          BUNDLE_DIGEST: ${{ needs.build.outputs.bundle_digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          scripts/release/publish-aliases.sh "$VERSION" "$BUNDLE_DIGEST"
          printf 'Release bundle: `%s`\n' \
            "oci://$GHCR_ROOT/release-bundle@$BUNDLE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish stable TypeScript client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          package_file="$(find dist/npm -maxdepth 1 -name '*.tgz' -print -quit)"
          expected_integrity="$(node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const digest = crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64");
            process.stdout.write(`sha512-${digest}`);
          ' "$package_file")"
          if published_integrity="$(npm view "@lightspeed/agent-client@$VERSION" dist.integrity 2>/dev/null)"; then
            test "$published_integrity" = "$expected_integrity" || {
              echo "npm version $VERSION already exists with different bytes" >&2
              exit 1
            }
          else
            npm publish "$package_file" --access public --tag latest
          fi
          npm dist-tag add "@lightspeed/agent-client@$VERSION" latest
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "$TAG" --pattern release-manifest.json --dir existing-release
            cmp dist/release-manifest.json existing-release/release-manifest.json
            published_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for file in \
              dist/archives/*.tar.gz \
              dist/npm/*.tgz \
              dist/checksums.txt \
              dist/release-manifest.json \
              dist/sbom.spdx.json; do
              grep -Fx "$(basename "$file")" <<< "$published_assets"
            done
          else
            gh release create "$TAG" --verify-tag --notes-from-tag \
              dist/archives/*.tar.gz \
              dist/npm/*.tgz \
              dist/checksums.txt \
              dist/release-manifest.json \
              dist/sbom.spdx.json
          fi

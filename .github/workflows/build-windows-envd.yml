name: build Windows envd

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, windows, x64, hz01, protected]
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build, package, and exercise the selected commit
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: ./scripts/release/build-windows.ps1 -ExpectedSha $env:EXPECTED_SHA
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-windows/archives/*.tar.gz
            dist-windows/provenance/windows-envd.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-envd-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist-windows/archives/
            dist-windows/provenance/
          if-no-files-found: error
          retention-days: 3
